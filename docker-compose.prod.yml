services:
  web:
    image: ghcr.io/the-broke-sommeliers/wine-cellar-web:latest
    command: gunicorn wine_cellar.conf.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --threads 4 --workers 2
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    expose:
      - 8000
    env_file:
      - ./.env.prod
    environment:
      - CONTAINER_ROLE=web
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - 127.0.0.1:8085:80
    volumes:
      - ./caddy:/etc/caddy/
      - static_volume:/srv/static
      - media_volume:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
  celery:
    image: ghcr.io/the-broke-sommeliers/wine-cellar-web:latest
    command: celery -A wine_cellar.conf worker -l info
    env_file:
      - ./.env.prod
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
  celery-beat:
    image: ghcr.io/the-broke-sommeliers/wine-cellar-web:latest
    command: celery -A wine_cellar.conf beat -l info
    env_file:
      - ./.env.prod
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  postgres_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
