name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - rc

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT }}
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install Commitizen
        run: pip install commitizen==4.16.3
      - name: Bump version with Commitizen
        id: bump
        run: |
          set -e
          if [ "${{ github.event.inputs.release_type }}" == "rc" ]; then
            NEXT_VERSION=$(cz bump --get-next -pr rc)
          else
            NEXT_VERSION=$(cz bump --get-next)
          fi
          if [ "${{ github.event.inputs.release_type }}" == "rc" ]; then
            echo "Creating RC release..."
            cz bump --yes -pr rc
          else
            echo "Creating normal release..."
            cz bump --yes
          fi
          cz changelog
          uv lock --upgrade-package wine_cellar
          git add uv.lock CHANGELOG.md
          git commit --amend --no-edit
          git tag -d "$NEXT_VERSION"
          git tag "$NEXT_VERSION"
          echo "NEW_VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
      - name: Push version bump commit + tag
        run: |
          git push
          git push --tags
      - name: Show new version
        env:
          NEW_VERSION: ${{ steps.bump.outputs.NEW_VERSION }}
        run: echo "The new version is $NEW_VERSION"
