name: wine-cellar-dev

services:
  web:
    build: .
    command: >
      sh -c "npm install && npm run watch & exec python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/usr/src/app
    ports:
      - 127.0.0.1:8000:8000
    env_file:
      - ./.env.dev
    environment:
      - CONTAINER_ROLE=web
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=django_dev_user
      - POSTGRES_PASSWORD=django_dev_password
      - POSTGRES_DB=django_dev
  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
  celery:
    build: .
    command: celery -A wine_cellar.conf worker -l info
    env_file:
      - ./.env.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started
  celery-beat:
    build: .
    command: celery -A wine_cellar.conf beat -l info
    env_file:
      - ./.env.dev
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
